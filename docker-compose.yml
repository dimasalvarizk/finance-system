version: '3.8'

services:
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - INVOICE_SERVICE_URL=http://invoice-service:5002
      - REQUEST_SERVICE_URL=http://request-service:5003
      - COMPANY_SERVICE_URL=http://company-service:5004
      - SETTING_SERVICE_URL=http://setting-service:5005
      - HOTEL_RESERVATION_SERVICE_URL=http://hotel-reservation-service:5006
    depends_on:
      - auth-service
      - invoice-service
      - request-service
      - company-service
      - setting-service
      - hotel-reservation-service
    restart: always

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    environment:
      - PORT=5001
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-https://odstfin.io}
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-smtp.titan.email}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    restart: always

  invoice-service:
    build:
      context: ./backend/invoice-service
      dockerfile: Dockerfile
    environment:
      - PORT=5002
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  request-service:
    build:
      context: ./backend/request-service
      dockerfile: Dockerfile
    environment:
      - PORT=5003
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  company-service:
    build:
      context: ./backend/company-service
      dockerfile: Dockerfile
    environment:
      - PORT=5004
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  setting-service:
    build:
      context: ./backend/setting-service
      dockerfile: Dockerfile
    environment:
      - PORT=5005
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  hotel-reservation-service:
    build:
      context: ./backend/hotel-reservation-service
      dockerfile: Dockerfile
    environment:
      - PORT=5006
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:5001
      - DB_HOST=${DB_HOST:-mysql-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
    restart: always

  finance-frontend:
    build:
      context: ./finance-frontend
      dockerfile: Dockerfile
      args:
        - VITE_AUTH_API_URL=${VITE_AUTH_API_URL:-https://api.odstfin.io}
        - VITE_INVOICE_API_URL=${VITE_INVOICE_API_URL:-https://api.odstfin.io}
        - VITE_REQUEST_API_URL=${VITE_REQUEST_API_URL:-https://api.odstfin.io}
        - VITE_SETTING_API_URL=${VITE_SETTING_API_URL:-https://api.odstfin.io}
        - VITE_HOTEL_RESERVATION_API_URL=${VITE_HOTEL_RESERVATION_API_URL:-https://api.odstfin.io}
    expose:
      - "80"
    command: [ "nginx", "-g", "daemon off;" ]
    restart: always

  # --- DATABASE MYSQL ---
  mysql-db:
    image: mysql:8.0
    ports:
      # testing
      - "${MYSQL_PORT:-3307}:3306"
      # production
      # - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: always

# --- PENYIMPANAN DATABASE ---
volumes:
  db_data:

