version: '3.8'

services:
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    environment:
      - PORT=5000
      - NODE_ENV=production
      - 'AUTH_SERVICE_URL=http://auth-service:5001'
      - 'INVOICE_SERVICE_URL=http://invoice-service:5002'
      - 'REQUEST_SERVICE_URL=http://request-service:5003'
      - 'COMPANY_SERVICE_URL=http://company-service:5004'
      - 'SETTING_SERVICE_URL=http://setting-service:5005'
    depends_on:
      - auth-service
      - invoice-service
      - request-service
      - company-service
      - setting-service
    restart: always

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./backend/auth-service/.env
    environment:
      - PORT=5001
      - NODE_ENV=production
    restart: always

  invoice-service:
    build:
      context: ./backend/invoice-service
      dockerfile: Dockerfile
    env_file:
      - ./backend/invoice-service/.env
    environment:
      - PORT=5002
      - NODE_ENV=production
    restart: always

  request-service:
    build:
      context: ./backend/request-service
      dockerfile: Dockerfile
    env_file:
      - ./backend/request-service/.env
    environment:
      - PORT=5003
      - NODE_ENV=production
    restart: always

  company-service:
    build:
      context: ./backend/company-service
      dockerfile: Dockerfile
    env_file:
      - ./backend/company-service/.env
    environment:
      - PORT=5004
      - NODE_ENV=production
    restart: always

  setting-service:
    build:
      context: ./backend/setting-service
      dockerfile: Dockerfile
    env_file:
      - ./backend/setting-service/.env
    environment:
      - PORT=5005
      - NODE_ENV=production
    restart: always

  finance-frontend:
    build:
      context: ./finance-frontend
      dockerfile: Dockerfile
      args:
        - 'VITE_SETTING_API_URL=https://api.odstfin.io'
    restart: always

  # --- INI TAMBAHAN DATABASE INTERNALNYA ---
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password_rahasia
      MYSQL_DATABASE: finance_db
      MYSQL_USER: dst_user
      MYSQL_PASSWORD: dst_password_rahasia
    volumes:
      - db_data:/var/lib/mysql
    restart: always

# --- INI PENYIMPANAN DATABASENYA ---
volumes:
  db_data:
